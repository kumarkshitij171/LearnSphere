version: '3'
services:
  db:
    image: postgres
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - 5432:5432  # make sure you don't have another container running on 5432

    environment:
      - POSTGRES_DB=testDB
      - POSTGRES_USER=testUser
      - POSTGRES_PASSWORD=mysecretpassword

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

# DatabseURL = postgres://testUser:mysecretpassword@localhost:5432/testDB
# AdminerURL = http://localhost:8080 
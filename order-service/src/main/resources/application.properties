spring.application.name=order-service
server.port=${PORT:8086}

# Local secrets live in order-service/.env (gitignored); see .env.sample
spring.config.import=optional:file:.env[.properties]

# --- Postgres: own schema `orders` in the shared instance (DATABASE_DESIGN.md §3.4) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/testDB?currentSchema=orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:testUser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
spring.flyway.schemas=orders
spring.flyway.default-schema=orders
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=orders

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# --- auth: verifies the access token backend issues; never issues one ---
lms.auth.access-token-secret=${ACCESS_TOKEN_SECRET:}
lms.auth.access-token-cookie=access_token

# --- catalogue owner (backend today, course-service after the split) ---
lms.catalogue.base-url=${CATALOGUE_BASE_URL:http://localhost:5000}
lms.catalogue.internal-api-key=${INTERNAL_API_KEY:}
lms.catalogue.timeout=PT3S

# --- Redis: per-user rate limit only; correctness never depends on it ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:local}
spring.data.redis.timeout=PT0.5S
# fail open fast: a Redis outage must not stall checkout behind a long connect timeout
spring.data.redis.connect-timeout=PT0.5S
# a Redis outage must not mark the service unhealthy: the limiter fails open
management.health.redis.enabled=false

# --- browser origins allowed to call this service with cookies ---
lms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- orders ---
lms.order.default-tenant=learnsphere
lms.order.ttl=PT15M
lms.order.topics.paid=order.paid
lms.order.topics.failed=order.failed
lms.order.topics.refunded=order.refunded
# owned by notification-service; we only produce to it
lms.order.topics.notifications=notifications
lms.order.topic-partitions=3
lms.order.outbox.batch-size=100
lms.order.outbox.poll-interval-ms=1000
lms.order.outbox.send-timeout=PT10S
lms.order.rate-limit.per-minute=10
# reconciliation: lost webhooks + expiry (SYSTEM_DESIGN.md §7.3-7.4)
lms.order.sweeper.interval-ms=300000
lms.order.sweeper.initial-delay-ms=60000
lms.order.sweeper.grace=PT5M
lms.order.sweeper.batch-size=100

# --- payment providers: each behind its own flag ---
lms.payment.mock.enabled=${MOCK_PAYMENTS_ENABLED:true}
lms.payment.mock.webhook-secret=${MOCK_WEBHOOK_SECRET:mock_webhook_secret}

management.endpoints.web.exposure.include=health,info,metrics
lms.payment.razorpay.enabled=${RAZORPAY_ENABLED:false}
lms.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
lms.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
lms.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
lms.payment.razorpay.base-url=https://api.razorpay.com
lms.payment.razorpay.timeout=PT10S
lms.payment.stripe.enabled=${STRIPE_ENABLED:false}
lms.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
lms.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
lms.payment.stripe.base-url=https://api.stripe.com
lms.payment.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/courses/{courseId}?order={orderId}}
lms.payment.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/courses/{courseId}}
lms.payment.stripe.timeout=PT10S
lms.payment.stripe.signature-tolerance=PT5M

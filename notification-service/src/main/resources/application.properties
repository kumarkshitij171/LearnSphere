spring.application.name=notification-service
server.port = 8085

# https://www.youtube.com/watch?v=jqujGrm7tNI&list=PLdUn31k8Q723lAfT2QOWoSA4C-UFQLDGI&index=3

# --- MongoDB (docker-compose: mongo/mongo123) ---
spring.mongodb.uri=${MONGODB_URI:mongodb://mongo:mongo123@localhost:27017/notifications?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# --- Redis (idempotency; docker-compose requirepass local) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:local}

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- SMTP: same account backend/utils/sendMail.ts uses ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER_EMAIL:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- notification service ---
lms.notification.topics.main=notifications
# retry topics are notifications_retry-0..N, created by @RetryableTopic in NotificationListener
lms.notification.topics.dlq=notifications_dlq
lms.notification.topic-partitions=3
lms.notification.mail-from=${SMTP_USER_EMAIL:no-reply@learnsphere.local}
# how long a notificationId stays claimed in Redis (ISO-8601 duration)
lms.notification.idempotency-ttl=PT24H

management.endpoints.web.exposure.include=health,info,metrics

# Insert bundled templates (resources/seed-templates) that are missing; never overwrites edits.
lms.notification.seed-templates=${SEED_TEMPLATES:true}
lms.notification.seed-tenant=learnsphere

# --- auth: verifies backend-issued access tokens; never issues one ---
spring.config.import=optional:file:.env[.properties]
lms.auth.access-token-secret=${ACCESS_TOKEN_SECRET:}
lms.auth.access-token-cookie=access_token
lms.auth.internal-api-key=${INTERNAL_API_KEY:}
lms.notification.default-tenant=learnsphere

# --- push (FCM HTTP v1). Off until a Firebase service-account key is configured ---
lms.notification.push.enabled=${PUSH_ENABLED:false}
lms.notification.push.credentials-path=${FIREBASE_CREDENTIALS:}
lms.notification.push.fcm-base-url=https://fcm.googleapis.com
lms.notification.push.link-base=${APP_BASE_URL:http://localhost:3000}
lms.notification.push.timeout=PT10S

lms.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- retries: non-blocking, exponential (~30s, 2m, 8m), then the DLQ (SYSTEM_DESIGN.md §8) ---
lms.notification.retry.attempts=4
lms.notification.retry.initial-delay-ms=30000
lms.notification.retry.multiplier=4
lms.notification.retry.max-delay-ms=600000

# --- rate limits (Redis sliding windows; fail open). Over-limit messages wait on the retry topics ---
lms.notification.rate-limit.enabled=true
lms.notification.rate-limit.channel-window=PT1M
lms.notification.rate-limit.per-channel.email=300
lms.notification.rate-limit.per-channel.push=1000
lms.notification.rate-limit.per-channel.sms=60
lms.notification.rate-limit.user-window=PT10M
lms.notification.rate-limit.per-user-template=5

# --- SMS (Twilio). Off until credentials are configured ---
lms.notification.sms.enabled=${SMS_ENABLED:false}
lms.notification.sms.account-sid=${TWILIO_ACCOUNT_SID:}
lms.notification.sms.auth-token=${TWILIO_AUTH_TOKEN:}
lms.notification.sms.from=${TWILIO_FROM:}
lms.notification.sms.base-url=https://api.twilio.com
lms.notification.sms.timeout=PT10S
